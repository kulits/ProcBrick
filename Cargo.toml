[package]
name = "procbrick"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Procedural brick assemblies for BrickFlow"
license = "MIT"
publish = false

[lib]
path = "rust/lib.rs"

[dependencies]
glamx = "0.3"
lru = { version = "0.18", optional = true }
memmap2 = "0.9"
parry3d-f64 = { version = "0.31", optional = true }
pyo3 = { version = "0.29", features = ["abi3-py310"], optional = true }
rustc-hash = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"

[features]
default = ["python"]
python = ["dep:lru", "dep:parry3d-f64", "dep:pyo3", "dep:rustc-hash"]  # the sampler and procbrick._core

[profile.release]
codegen-units = 1
lto = "fat"
