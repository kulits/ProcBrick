[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "procbrick"
dynamic = ["version"]
description = "Procedural brick assemblies for BrickFlow"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Peter Kulits" }]
dependencies = ["bricknet==0.1.1", "huggingface_hub>=0.23", "numpy", "pillow>=11.3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://kulits.github.io/BrickFlow/"
Repository = "https://github.com/kulits/ProcBrick"

[tool.maturin]
python-source = "src"
module-name = "procbrick._core"
include = [{ path = ".cargo/config.toml", format = "sdist" }]

[tool.black]
line-length = 120
target-version = ["py310"]
